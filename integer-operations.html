 $('#nav').replaceChildren(...[['add','加法'],['sub','减法'],['mul','乘法'],].map(([mode,label])=>button(label,`mode:${mode}`,{active:mode===st.mode})));
 const ctx=$('#context');ctx.replaceChildren();
 if(['add','sub','mul'].includes(st.mode)){
  const p=st.mode==='add'?[[7,1,'7 + 1'],[15,1,'15 + 1'],[8,8,'8 + 8']]:st.mode==='sub'?[[0,1,'0 − 1'],[0,8,'0 − 8'],[7,15,'7 − 15']]:[[7,3,'7 × 3'],[15,2,'15 × 2'],[8,2,'8 × 2']];
  for(const [a,b,label]of p)ctx.append(button(label,`preset:${a}:${b}`,{active:st.a===a&&st.b===b}));
  if(st.mode==='add'){ctx.append(button('单步','step',{title:'每次计算一个低位'}));ctx.append(button('播放进位','play',{primary:true,title:'从最低位开始，逐位计算并显示进位'}));}
 }else if(st.mode==='width'){
  ctx.append(button('1101','setext:13',{active:st.ext===13}),button('0101','setext:5',{active:st.ext===5}),button('播放扩展','extend',{primary:true}),button('播放截断','trim',{primary:true}));
 }else{
  ctx.append(button('−7','setshift:9',{active:st.shiftA===9}),button('+7','setshift:7',{active:st.shiftA===7}),button('k −','k:-1'),button('k +','k:1'),button('播放右移','shift',{primary:true}));
 }
 ctx.append(button('重置','reset'));
}
function announce(){if(['add','sub','mul'].includes(st.mode)){const r=arithmetic(st.a,st.b,st.mode);$('#live').textContent=`结果 ${bits(r.r)}；无符号 ${r.r}；补码 ${r.sr}。${r.so?'发生有符号溢出，不能视作 C 的确定结果。':''}`;}else $('#live').textContent=st.mode==='width'?'观察零扩展、符号扩展和截断。':'算术右移向下，整数除法向零。';}
function render(){ $('#drawing').replaceChildren(renderSvg(makeScene({interactive:!staticMode,state:st})));$('#controls').style.display=staticMode?'none':'flex';if(!staticMode)controls(); }
function stop(){token++;st.playKind=null;st.anim=1;}
function playAdd(){stop();const id=token;st.step=0;render();for(let i=1;i<=4;i++)setTimeout(()=>{if(id!==token)return;st.step=i;render();if(i===4)announce();},i*650);}
function animate(kind){stop();const id=token,start=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;st.playKind=kind;st.anim=0;
 function tick(t){if(id!==token)return;const p=reduced?1:Math.min(1,(t-start)/950);st.anim=1-(1-p)**3;render();if(p<1)requestAnimationFrame(tick);else announce();}requestAnimationFrame(tick);
}
function action(str){const [act,val,val2]=str.split(':');
 if(act==='play')return playAdd();if(['extend','trim','shift'].includes(act)&&val===undefined)return animate(act);
 stop();
 if(act==='mode'){st.mode=val;st.step=4;}else if(['a','b','ext','trim','shiftA'].includes(act)){st[act]^=2**Number(val);st.step=4;}
 else if(act==='preset'){st.a=Number(val);st.b=Number(val2);st.step=4;}
 else if(act==='step')st.step=st.step===4?0:st.step+1;
 else if(act==='setext')st.ext=Number(val);
 else if(act==='setshift')st.shiftA=Number(val);
 else if(act==='k')st.k=Math.max(0,Math.min(3,st.k+Number(val)));
 else if(act==='reset')st=baseState();
 render();announce();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t)action(t.dataset.action);});
document.addEventListener('keydown',e=>{
 if((e.code==='Enter'||e.code==='Space')&&e.target.matches('svg [data-action]')){e.preventDefault();action(e.target.dataset.action);}
 else if(e.code==='Space'&&!['BUTTON','INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();if(st.mode==='add')playAdd();else if(st.mode==='width')animate('extend');else if(st.mode==='shift')animate('shift');}
});
function resize(){const scale=Math.min(innerWidth/1440,innerHeight/810),el=$('#stage');el.style.transform=`scale(${scale})`;el.style.left=(innerWidth-1440*scale)/2+'px';el.style.top=(innerHeight-810*scale)/2+'px';}
addEventListener('resize',resize);render();resize();
window.integerDemo={getState:()=>({...st}),setState:patch=>{stop();st={...st,...patch};render();},arithmetic,shifting,bits,signed,makeScene,action};

</script></body></html>
