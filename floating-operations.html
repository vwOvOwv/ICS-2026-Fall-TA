'use strict';
// Offline float model: exact rational inputs/intermediates and nearest-even rounding.
// No fused operations, reassociation, exception traps, or NaN payload simulation.
// Rounding reference: https://docs.nvidia.com/cuda/floating-point/index.html#operations-and-accuracy
// Monotonicity: apply the same order-preserving rounding map to two exact results.
// The decimal multiplication example follows the supplied slide: 100.00001f * 1.3f vs 100.0f * 1.3f.

const $=id=>document.getElementById(id),stage=$('stage'),scene=$('scene');

const abs=n=>n<0n?-n:n;function gcd(a,b){a=abs(a);b=abs(b);while(b){let t=a%b;a=b;b=t}return a||1n}function rat(n,d=1n){if(d===0n)throw Error('分母为零');if(d<0n){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}}function radd(a,b){return rat(a.n*b.d+b.n*a.d,a.d*b.d)}function rmul(a,b){return rat(a.n*b.n,a.d*b.d)}const bitlen=n=>n.toString(2).length;
const buffer=new ArrayBuffer(4),dv=new DataView(buffer);function bits(x){dv.setFloat32(0,x,false);return dv.getUint32(0,false)}function frombits(b){dv.setUint32(0,b>>>0,false);return dv.getFloat32(0,false)}function hex(x){return '0x'+bits(x).toString(16).padStart(8,'0').toUpperCase()}function asrat(x){if(!Number.isFinite(x))return null;const b=bits(x),ex=(b>>>23)&255,fr=b&0x7fffff;let n=BigInt(ex?0x800000+fr:fr);if(b>>>31)n=-n;const e=(ex?ex-127:-126)-23;return e>=0?rat(n<<BigInt(e)):rat(n,1n<<BigInt(-e))}

}

// Every numeric label is exact. Long dyadic values use an exact power expression.
function signed(s){return String(s).replace(/-/g,'−')}

function representation(q,limit=26){
 const full=decimal(q),normal=grouped(full),b=dyadic(q);
 if(b&&abs(b.n)===1n&&full.length>16){const sign=b.n<0n?'−':'';return {html:sign+powHTML(2,b.e),text:sign+'2^'+b.e,full,kind:'power'}}

 if(b&&abs(b.n)===1n){const sign=b.n<0n?'−':'';return {html:sign+powHTML(2,b.e),text:sign+'2^'+b.e,full,kind:'power'}}
 const sign=full.startsWith('-')?'−':'',body=full.replace(/^-/,'');let [i,f='']=body.split('.');let digits,exp;
 if(i!=='0'){exp=i.length-1;digits=(i+f).replace(/0+$/,'')}else{const first=f.search(/[1-9]/);exp=-first-1;digits=f.slice(first).replace(/0+$/,'')}
 const mantissa=digits.length>1?digits[0]+'.'+digits.slice(1):digits;
 const sci={html:esc(sign+mantissa)+' × '+powHTML(10,exp),text:sign+mantissa+' × 10^'+exp,full,kind:'scientific'};
 if(sci.text.length<=limit)return sci;
 if(b&&b.e!==0){const coeff=signed(b.n.toString()),bp={html:esc(coeff)+' × '+powHTML(2,b.e),text:coeff+' × 2^'+b.e,full,kind:'power'};if(bp.text.length<normal.length&&bp.text.length<=sci.text.length)return bp}

function reprValue(x,limit=26){return !Number.isFinite(x)||x===0?{html:esc(specialText(x)),text:specialText(x),full:specialText(x),kind:'special'}:representation(asrat(x),limit)}

function editInputs(){
 openDialog('修改 float 输入',`<p>支持十进制、科学计数法和 <code>2^24</code>。${state.mode==='monotone'?' 本实验要求保存后的输入满足 <code>a &gt; b</code>。':''}</p>${state.mode==='monotone'?`<div class="edit-actions"><button id="mono-add" class="${state.monoOp==='+'?'active':''}">加法：a + c 与 b + c</button><button id="mono-mul" class="${state.monoOp==='*'?'active':''}">乘法：a × c 与 b × c</button></div>`:''}<div class="editgrid">${['a','b','c'].map((v,i)=>`<label>${v}<input id="input-${v}" value="${esc(state.raw[i])}" spellcheck="false" maxlength="100" aria-label="输入 ${v}"></label>`).join('')}</div><div id="editerror" class="editerror"></div><div class="edit-actions"><button id="apply" class="primary">应用并重新演示</button><button id="default-input">恢复默认输入</button></div><p class="note">输入和每一步结果均按最近偶数规则舍入为 float。主画面展示实际保存的值。</p>`);
 $('apply').onclick=()=>{try{const raw=['a','b','c'].map(v=>$('input-'+v).value.trim());raw.forEach(parse32);if(state.mode==='monotone'){validateMono(raw);state.monoCase='custom';state.monoOp=$('mono-mul').classList.contains('active')?'*':'+';}state.raw=raw;state.phase=0;closeDialog();render()}catch(e){$('editerror').textContent=e.message}};
 $('default-input').onclick=()=>{const raw=state.mode==='monotone'?(monoCases.find(x=>x.id===state.monoCase)||monoCases.find(x=>x.op===state.monoOp)).raw:defaults[state.mode];raw.forEach((v,i)=>$('input-'+['a','b','c'][i]).value=v)};
 if(state.mode==='monotone'){
  $('mono-add').onclick=()=>{$('mono-add').classList.add('active');$('mono-mul').classList.remove('active')};
  $('mono-mul').onclick=()=>{$('mono-mul').classList.add('active');$('mono-add').classList.remove('active')};
 }
 ['a','b','c'].forEach(v=>$('input-'+v).addEventListener('keydown',e=>{if(e.key==='Enter')$('apply').click()}));
}
function showDetail(key){
 const s=details[key];if(!s)return;
 openDialog('精确值',`<table><tr><th>输入</th><th>精确十进制值</th><th>位模式</th></tr>${[[s.a,'a / b'],[s.b,'b / c']].map(([v],i)=>`<tr><td>${i?'右操作数':'左操作数'}</td><td><code>${esc(describeValue(v))}</code></td><td><code>${hex(v)}</code></td></tr>`).join('')}</table><h3>${s.q?'精确运算结果':'特殊值结果'}</h3><div class="exactdump">${esc(s.exact)}</div><h3>保存为 float</h3><div class="exactdump">${esc(describeValue(s.value))}</div><p class="note" style="margin-top:13px">${esc(resultDetail(s))}。幂式是精确表示，不是近似值。</p>`);
}
const info={
 commute:['交换律',`<p>对有限输入，加法、乘法满足交换律：</p><p><code>fl(a + b) = fl(b + a)<br>fl(a × b) = fl(b × a)</code></p><p>精确结果相同，按同一规则舍入后也相同。</p>`],
 associate:['结合律',`<p><code>fl(fl(a ∘ b) ∘ c)</code> 与 <code>fl(a ∘ fl(b ∘ c))</code> 不一定相等。</p><p>改变括号，会改变中间的舍入或溢出。已经丢失的信息，后续运算不会自动找回。</p>`],
 monotone:['不严格单调：严格不等式可能变成相等',`<p class="mono-emphasis"><strong>仍然单调，但不保证严格单调。</strong><br>加法或乘以正数时，更大的输入不会得到更小的结果，却可能得到相同结果。</p><p>设 <code>a ≥ b</code>，且 a、b、c 均为有限 float：</p><div class="mono-rules"><div class="rule"><span>加法</span><code>fl(a + c) ≥ fl(b + c)</code></div><div class="rule"><span>乘法 · c ≥ 0</span><code>fl(a × c) ≥ fl(b × c)</code></div><div class="rule"><span>乘法 · c ≤ 0</span><code>fl(a × c) ≤ fl(b × c)</code></div></div><p>即使 <code>a &gt; b</code>，两个不同的精确结果也可能<strong>舍入到同一值</strong>，或<strong>同时溢出为同号无穷大</strong>。</p><div class="mono-example-links"><button data-monodemo="add">演示：加法舍入</button><button data-monodemo="mul-round">演示：乘法舍入</button><button data-monodemo="mul-overflow">演示：同时溢出</button></div><p class="note">fl 表示按最近偶数规则保存为 float；不含 NaN 输入。乘以负数时，反向是乘法本来的性质，不是舍入颠倒了顺序。乘以 0 本来就得到相等结果。</p>`],
 identity:['单位元与逆元',`<p>对有限 x，按数值相等理解：</p><p><code>fl(x + 0) = x<br>fl(x + (−x)) = 0</code></p><p class="note">+0 与 −0 数值相等，位模式不同。以上结论不包含 NaN 和无穷大。</p>`]
};
scene.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d){showDetail(d.dataset.detail);return}const s=e.target.closest('[data-spec]');if(s){stop();state.special=Number(s.dataset.spec);state.phase=0;render();return}const c=e.target.closest('[data-cmp]');if(c){state.cmp=c.dataset.cmp;render()}});
scene.addEventListener('keydown',e=>{const d=e.target.closest('[data-detail]');if(d&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();showDetail(d.dataset.detail)}});
document.querySelectorAll('.tabs [data-mode]').forEach(b=>{b.onclick=()=>setMode(b.dataset.mode);b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();e.stopPropagation();const tabs=[...document.querySelectorAll('.tabs [data-mode]')],i=tabs.indexOf(b),next=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];setMode(next.dataset.mode);next.focus()}})});
function showMonotoneInfo(){openDialog(...info.monotone);$('dialogbody').querySelectorAll('[data-monodemo]').forEach(b=>b.onclick=()=>{closeDialog();setMonoCase(b.dataset.monodemo)})}
 document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{if(b.dataset.info==='monotone'){if(state.mode==='monotone')showMonotoneInfo();else setMode('monotone')}else openDialog(...info[b.dataset.info])});
$('close').onclick=closeDialog;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDialog()};$('next').onclick=()=>advance();$('back').onclick=()=>{stop();state.phase=Math.max(0,state.phase-1);render()};$('play').onclick=autoplay;$('restart').onclick=reset;
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if($('overlay').classList.contains('open')){if(e.key==='Escape'){e.preventDefault();closeDialog()}if(e.key==='Tab'){const items=[...$('overlay').querySelectorAll('button,input,select,[tabindex="0"]')],first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}
 if(e.target.closest('input,select,textarea,[role="button"]'))return;if(e.target.closest('button')&&e.code==='Space')return;
 if(e.code==='Space'||e.key==='ArrowRight'){e.preventDefault();advance()}else if(e.key==='ArrowLeft'){e.preventDefault();$('back').click()}else if(e.key.toLowerCase()==='r'){e.preventDefault();reset()}
});
function resize(){const z=Math.min(innerWidth/1440,innerHeight/810);stage.style.transform='scale('+z+')';stage.style.left=(innerWidth-1440*z)/2+'px';stage.style.top=(innerHeight-810*z)/2+'px'}
addEventListener('resize',resize);addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();updateFooter()}});
const params=new URLSearchParams(location.search);if(['add','mul','monotone','special'].includes(params.get('mode')))state.mode=params.get('mode');if(defaults[state.mode])state.raw=defaults[state.mode].slice();if(state.mode==='monotone'){const p=monoCases.find(x=>x.id===params.get('example'))||monoCases[0];state.monoCase=p.id;state.monoOp=p.op;state.raw=p.raw.slice()}state.phase=Math.max(0,Math.min(phases(),Math.trunc(Number(params.get('step')))||0));
// Exposed for inspecting the numerical model and driving classroom demonstrations.
window.floatOps={parse32,round32,rat,asrat,radd,rmul,stepOp,decimal,bits,frombits,model,monoModel,representation,reset,advance,stop,setMode,setMonoCase,getState:()=>({...state,raw:state.raw.slice()}),setPhase(p){stop();state.phase=Math.max(0,Math.min(phases(),Math.trunc(p)||0));render()},setInput(raw){if(raw.length!==3)throw Error('需要三个输入');raw.forEach(parse32);if(state.mode==='monotone'){validateMono(raw);state.monoCase='custom'}state.raw=raw.slice();state.phase=0;render()}};
resize();render();
</script>
</body>
</html>
